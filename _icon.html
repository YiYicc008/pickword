<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>icon render</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg, img { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
const maskable = q.get('maskable') === '1';
const svg = maskable
  ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs><linearGradient id="p" x1="0" y1="0" x2="0.2" y2="1">
        <stop offset="0" stop-color="#fcf9f3"/><stop offset="1" stop-color="#efe7db"/></linearGradient>
        <linearGradient id="s" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#c9533a"/><stop offset="1" stop-color="#a93c28"/></linearGradient></defs>
      <rect width="512" height="512" fill="url(#p)"/>
      <g transform="translate(256 256) scale(0.76) translate(-256 -256)">
        <rect x="110" y="110" width="292" height="292" rx="78" fill="url(#s)"/>
        <rect x="126" y="126" width="260" height="260" rx="64" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
        <text x="256" y="262" font-family="Palatino Linotype, Palatino, Georgia, serif" font-size="200"
              font-weight="700" fill="#fff8f2" text-anchor="middle" dominant-baseline="central">A</text>
      </g>
    </svg>`
  : `<img src="assets/icon.svg" alt="">`;
document.body.innerHTML = svg;
</script>
</body></html>
