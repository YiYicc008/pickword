<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>netcheck</title>
</head>
<body>
<pre id="out">running…</pre>
<script>
const out = document.getElementById('out');
const lines = [];
const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };

async function main() {
  try {
    const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/serendipity');
    log('dictionaryapi status=' + r.status + ' cors=ok');
    const j = await r.json();
    const e = j[0] || {};
    log('phonetic=' + (e.phonetic || (e.phonetics || []).map((p) => p.text).filter(Boolean)[0]));
    const ph = (e.phonetics || []).find((p) => p.audio);
    log('audio=' + (ph ? ph.audio : 'none'));
    const m = (e.meanings || [])[0] || {};
    log('pos=' + m.partOfSpeech);
    log('def=' + ((m.definitions || [])[0] || {}).definition);
  } catch (err) {
    log('dictionaryapi FAILED ' + err.message);
  }

  try {
    const r = await fetch('https://api.mymemory.translated.net/get?q=serendipity&langpair=en|zh-CN');
    const j = await r.json();
    log('mymemory status=' + r.status + ' zh=' + ((j.responseData || {}).translatedText || ''));
  } catch (err) {
    log('mymemory FAILED ' + err.message);
  }

  log('tts voices=' + (window.speechSynthesis ? speechSynthesis.getVoices().length : 'none'));
  log('crypto.subtle=' + Boolean(window.crypto && window.crypto.subtle));
  log('serviceWorker=' + ('serviceWorker' in navigator));
  log('localStorage=' + (() => { try { localStorage.setItem('t', '1'); localStorage.removeItem('t'); return 'ok'; } catch (e) { return 'blocked'; } })());
}

main();
</script>
</body>
</html>
